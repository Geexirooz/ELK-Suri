version: "3.5"

secrets:
  ca.crt:
    file: ./secrets/certificate_authority/ca/ca.crt

services:
  fleet-server:
    container_name: fleet-server
    hostname: fleet-server
    build:
      context: fleet-server/
      args:
        ELK_VERSION: ${ELK_VERSION}
    restart: unless-stopped
    environment:
      FLEET_SERVER_ENABLE: true
      FLEET_SERVER_POLICY_NAME: fleet-server-policy
      FLEET_SERVER_ELASTICSEARCH_HOST: ${ELASTICSEARCH_URL}
      FLEET_SERVER_SERVICE_TOKEN: ${FLEET_SERVER_SERVICE_TOKEN}
      FLEET_SERVER_ELASTICSEARCH_CA: ${FLEET_DIR}/config/ca.crt
    secrets:
      - source: ca.crt
        target: ${FLEET_DIR}/config/ca.crt
    ports:
      - "8220:8220"
    networks:
      - elk
networks:
  elk:
    driver: bridge

